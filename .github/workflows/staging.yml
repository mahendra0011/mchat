name: Staging Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    env:
      NODE_ENV: staging
      AUTH_JWT_SECRET: staging-jwt-secret-at-least-32-chars-long
      SESSION_COOKIE_SECRET: staging-cookie-secret-at-least-32-chars
      API_BASE_URL: http://staging.orbit.chat:4000
      WS_BASE_URL: ws://staging.orbit.chat:4000/v1/realtime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @orbit/api build

      - name: Run migrations
        run: pnpm --filter @orbit/api run migrate

      - name: Deploy to staging
        run: echo "Deploying to staging environment..."

      - name: Verify staging health
        run: pnpm --filter @orbit/api run health-check

      - name: Publish deployment status
        run: echo "Staging deployment complete"
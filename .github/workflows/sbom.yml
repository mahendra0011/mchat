name: SBOM Generation

on:
  push:
    branches: [main]
  release:
    types: [published]

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: production
      AUTH_JWT_SECRET: ci-only-jwt-secret-at-least-32-chars-long
      SESSION_COOKIE_SECRET: ci-only-cookie-secret-at-least-32-chars
      API_BASE_URL: http://localhost:4000
      WS_BASE_URL: ws://localhost:4000/v1/realtime
      REDACT_SENSITIVE_LOGS: "true"
      ENABLE_LOCAL_DEMO_FIXTURES: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @orbit/api build

      - name: Build Web
        run: pnpm --filter @orbit/web build

      - name: Generate SBOM (CycloneDX)
        run: |
          npx @cyclonedx/bom@latest -o sbom.json
        continue-on-error: true

      - name: Generate SBOM (Syft fallback)
        if: failure()
        run: |
          npx syft@latest packages dir:. -o cyclonedx-json=sbom.json
        continue-on-error: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
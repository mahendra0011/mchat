apiVersion: v1
kind: Service
metadata:
  name: orbit-api
  labels:
    app: orbit-api
spec:
  type: ClusterIP
  selector:
    app: orbit-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orbit-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
    # WebSocket upgrade for the realtime endpoint
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: api.orbit.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orbit-api
                port:
                  name: http
